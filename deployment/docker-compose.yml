# =============================================================================
# Swanford Academy - Production Docker Compose Configuration
# Target: Hostinger VPS
# Master Specification Reference: Sections 8, 21, 22
# =============================================================================

services:
  # Application Service (Next.js App Router)
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: swanford_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ../scripts:/app/scripts:ro
      - ../storage:/app/storage
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-https://swanfordacademy.com.ng}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - PAYSTACK_WEBHOOK_SECRET=${PAYSTACK_WEBHOOK_SECRET}
      - NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Swanford Academy}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swanford_network

  # Database Service (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: swanford_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - swanford_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - swanford_network

networks:
  swanford_network:
    driver: bridge

volumes:
  swanford_postgres_data:
    driver: local
