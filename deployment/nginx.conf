# =============================================================================
# Swanford Academy - Nginx Reverse Proxy Configuration
# Target: Hostinger VPS
# Master Specification Reference: Sections 14, 20, 21, 22
# =============================================================================

# Rate Limiting Zone for sensitive endpoints (10 requests per minute)
limit_req_zone $binary_remote_addr zone=sensitive_limit:10m rate=10r/m;

# Upstream Next.js Server
upstream swanford_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name swanfordacademy.com.ng www.swanfordacademy.com.ng;

    # Enforce HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name swanfordacademy.com.ng www.swanfordacademy.com.ng;

    # SSL Certificates (managed via Certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/swanfordacademy.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swanfordacademy.com.ng/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.paystack.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.paystack.co;" always;

    # Maximum upload size (admission forms, receipts)
    client_max_body_size 10M;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://swanford_upstream;
        proxy_cache_valid 200 365d;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sensitive API endpoints (rate limiting)
    location /api/auth/ {
        limit_req zone=sensitive_limit burst=5 nodelay;
        proxy_pass http://swanford_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main application proxy
    location / {
        proxy_pass http://swanford_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
